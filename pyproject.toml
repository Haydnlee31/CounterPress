[project]
name = "counterpress"
version = "0.1.0"
description = "Synthetic football insights: foundation contracts and API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pyjwt[crypto]>=2.15.1,<3",
    "msal>=1.39,<2",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "agent-framework-core>=1,<2",
    "agent-framework-openai>=1,<2",
    "openai>=3,<4",
    "httpx2>=2.13,<3",
    "azure-cosmos>=4.9,<5",
    "azure-identity>=1.23,<2",
    "azure-eventhub>=5.15,<6",
    "azure-eventhub-checkpointstoreblob-aio>=1.2,<2",
    "azure-messaging-webpubsubservice>=1.2,<2",
    "aiohttp>=3.11,<4",
    "azure-storage-blob>=12.25,<13",
    "azure-monitor-opentelemetry-exporter>=1.0.0b46,<2",
    "opentelemetry-sdk>=1.39,<2",
]

[project.optional-dependencies]
foundry-admin = [
    "azure-ai-projects>=2.3,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/counterpress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
