name: Build isolated Phase4 image

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: counterpress-azure-deployment
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: azure-demo
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      AZURE_CORE_OUTPUT: none
      AZURE_CORE_COLLECT_TELEMETRY: 'no'
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful CI for this exact main commit
        run: python3 scripts/deploy_azure.py check-ci
      - name: Build immutable verification image without cloud configuration
        run: docker build --platform linux/amd64 -t counterpress:phase4 .
      - name: Smoke-test the unchanged default runtime
        run: bash scripts/test_container.sh counterpress:phase4
      - name: Verify isolated entry point is packaged
        run: docker run --rm --network none --read-only counterpress:phase4 python -c "from counterpress.api.phase4 import create_app, ISOLATION; assert callable(create_app) and ISOLATION['CONTAINER_APP_NAME']=='counterpress-phase4'"
      - name: Authenticate with existing registry publication identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish digest only, never deploy either application
        run: python3 scripts/phase4_azure.py publish
