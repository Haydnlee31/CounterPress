name: Review Azure candidate

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Stage a zero-production-traffic candidate, or restore production and clean up'
        required: true
        default: stage
        type: choice
        options: [stage, cleanup]
      production_revision:
        description: 'Cleanup only: original production revision printed by staging'
        required: false
        type: string
      candidate_revision:
        description: 'Cleanup only: candidate revision printed by staging'
        required: false
        type: string

permissions:
  contents: read
  actions: read

# Shares the production workflow lock. Never race stage/cleanup with deployment.
concurrency:
  group: counterpress-azure-deployment
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: azure-demo
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      AZURE_CORE_OUTPUT: none
      AZURE_CORE_COLLECT_TELEMETRY: 'no'
    steps:
      - name: Check out exact dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful CI for current main commit
        if: inputs.operation == 'stage'
        run: python3 scripts/deploy_azure.py check-ci
      - name: Build production image without cloud configuration
        if: inputs.operation == 'stage'
        run: docker build --platform linux/amd64 -t counterpress:stage .
      - name: Smoke-test restricted container before Azure login
        if: inputs.operation == 'stage'
        run: bash scripts/test_container.sh counterpress:stage
      - name: Authenticate to Azure with federated identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Stage candidate without production traffic
        if: inputs.operation == 'stage'
        env:
          CP_AZURE_TARGET: ${{ secrets.CP_AZURE_TARGET }}
        run: python3 scripts/stage_azure.py stage
      - name: Restore original production and remove candidate
        if: inputs.operation == 'cleanup'
        env:
          CP_AZURE_TARGET: ${{ secrets.CP_AZURE_TARGET }}
          CP_PRODUCTION_REVISION: ${{ inputs.production_revision }}
          CP_CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
        run: python3 scripts/stage_azure.py cleanup --production "$CP_PRODUCTION_REVISION" --candidate "$CP_CANDIDATE_REVISION"
