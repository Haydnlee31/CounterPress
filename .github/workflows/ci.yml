name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python from .python-version
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run backend tests
        run: uv run --frozen pytest -q
      - name: Audit reproducible career ledger
        run: uv run --frozen python scripts/verify_personalization.py

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run frontend tests
        run: npm test
      - name: Build production frontend
        run: npm run build

  container:
    name: Container smoke and Azure templates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production image without secrets
        run: docker build --platform linux/amd64 -t counterpress:smoke .
      - name: Verify same-origin application in restricted container
        run: bash scripts/test_container.sh
      - name: Download and verify Bicep compiler
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64 -o "$RUNNER_TEMP/bicep"
          echo "b09ec25a9d376c1f8e33ede6ed22b587f915ad68488d5db77a6f9541748c7f6e  $RUNNER_TEMP/bicep" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bicep"
      - name: Compile Azure templates without signing in or provisioning
        run: |
          "$RUNNER_TEMP/bicep" build infra/foundation.bicep --outfile "$RUNNER_TEMP/foundation.json"
          "$RUNNER_TEMP/bicep" build infra/app.bicep --outfile "$RUNNER_TEMP/app.json"
          "$RUNNER_TEMP/bicep" build infra/budget.bicep --outfile "$RUNNER_TEMP/budget.json"
          "$RUNNER_TEMP/bicep" build infra/cosmos.bicep --outfile "$RUNNER_TEMP/cosmos.json"
          "$RUNNER_TEMP/bicep" build infra/streaming.bicep --outfile "$RUNNER_TEMP/streaming.json"
          "$RUNNER_TEMP/bicep" build infra/deployment-identity.bicep --outfile "$RUNNER_TEMP/deployment-identity.json"
          "$RUNNER_TEMP/bicep" build infra/monitoring.bicep --outfile "$RUNNER_TEMP/monitoring.json"
          "$RUNNER_TEMP/bicep" build infra/telemetry-ingestion.bicep --outfile "$RUNNER_TEMP/telemetry-ingestion.json"
