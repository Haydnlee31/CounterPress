name: Deploy Azure

on:
  workflow_dispatch:
    inputs:
      studio_mode:
        description: 'Studio review access (preserve when changing editorial mode)'
        required: true
        default: preserve
        type: choice
        options: [preserve, enable, disable]
      editorial_mode:
        description: 'Authenticated AI editor; uses existing durable request limits'
        required: true
        default: preserve
        type: choice
        options: [preserve, enable, disable]
      assistant_mode:
        description: 'Footie: enable bounded model calls using existing server-side model secrets'
        required: true
        default: preserve
        type: choice
        options: [preserve, enable, disable]
      assistant_workflow:
        description: 'Footie workflow; agent requires completed live validation and shared Cosmos admission'
        required: true
        default: preserve
        type: choice
        options: [preserve, agent, structured_lookup]

permissions:
  contents: read
  actions: read

concurrency:
  group: counterpress-azure-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: azure-demo
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      AZURE_CORE_OUTPUT: none
      AZURE_CORE_COLLECT_TELEMETRY: 'no'
    steps:
      - name: Check out exact dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful CI for current main commit
        run: python3 scripts/deploy_azure.py check-ci
      - name: Build production image without cloud configuration
        run: docker build --platform linux/amd64 -t counterpress:deploy .
      - name: Smoke-test restricted container before Azure login
        run: bash scripts/test_container.sh counterpress:deploy
      - name: Authenticate to Azure with federated identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Push exact image, update existing app and verify
        env:
          CP_STUDIO_MODE: ${{ inputs.studio_mode }}
          CP_STUDIO_IDENTITY: ${{ secrets.CP_STUDIO_IDENTITY }}
          CP_EDITORIAL_MODE: ${{ inputs.editorial_mode }}
          CP_EDITORIAL_MODEL: ${{ secrets.CP_EDITORIAL_MODEL }}
          CP_ASSISTANT_MODE: ${{ inputs.assistant_mode }}
          CP_ASSISTANT_WORKFLOW: ${{ inputs.assistant_workflow }}
          CP_AZURE_TARGET: ${{ secrets.CP_AZURE_TARGET }}
        run: python3 scripts/deploy_azure.py deploy
